name: cohort-manager

services:
  distribute-participant:
    container_name: distribute-participant
    image: cohort-manager-distribute-participant
    networks: [cohman-network]
    build:
      context: ./src/Functions/
      dockerfile: CohortDistributionServices/DistributeParticipant/Dockerfile
      args:
        BASE_IMAGE: ${FUNCTION_BASE_IMAGE}
    environment:
      - ServiceBusConnectionString_internal=${SERVICE_BUS_CONNECTION_STRING}
      - CohortDistributionTopic=cohort-distribution-topic
      - DistributeParticipantSubscription=distribute-participant-sub
      - AzureWebJobsStorage=${AZURITE_CONNECTION_STRING}
      - WEBSITE_HOSTNAME=distribute-participant:80
      - ExceptionFunctionURL=${CREATE_EXCEPTION_API_BASE_URL}CreateException
      - TransformDataServiceURL=${TRANSFORM_DATA_SERVICE_API_BASE_URL}TransformDataService
      - ParticipantManagementUrl=${PARTICIPANT_MANAGEMENT_DATA_SERVICE_API_BASE_URL}ParticipantManagementDataService
      - CohortDistributionDataServiceUrl=${COHORT_DISTRIBUTION_DATA_SERVICE_API_BASE_URL}CohortDistributionDataService/
      - LookupValidationURL=${LOOKUP_VALIDATION_API_BASE_URL}LookupValidation
      - StaticValidationURL=${STATIC_VALIDATION_API_BASE_URL}StaticValidation
      - ParticipantDemographicDataServiceURL=${PARTICIPANT_DEMOGRAPHIC_DATA_SERVICE_API_BASE_URL}ParticipantDemographicDataService
      - RemoveOldValidationRecordUrl=${REMOVE_VALIDATION_EXCEPTION_API_BASE_URL}RemoveValidationExceptionData
      - SendServiceNowMessageURL=${SERVICENOW_MESSAGE_HANDLER_API_BASE_URL}send
      - IgnoreParticipantExceptions=false
      - IsExtractedToBSSelect=true
      - MaxLookupValidationRetries=3

  retrieve-cohort-distribution-data:
    container_name: retrieve-cohort-distribution-data
    image: cohort-manager-retrieve-cohort-distribution-data
    networks: [cohman-network]
    build:
      context: ./src/Functions/
      dockerfile: CohortDistributionServices/RetrieveCohortDistribution/Dockerfile
      args:
        BASE_IMAGE: ${FUNCTION_BASE_IMAGE}
    profiles: [bs-select]
    ports:
      - 7078:7078
    environment:
      - ASPNETCORE_URLS=http://*:7078
      - DtOsDatabaseConnectionString=${DTOS_DATABASE_CONNECTION_STRING}
      - ExceptionFunctionURL=${CREATE_EXCEPTION_API_BASE_URL}CreateException
      - CohortDistributionDataServiceURL=${COHORT_DISTRIBUTION_DATA_SERVICE_API_BASE_URL}CohortDistributionDataService/
      - BsSelectRequestAuditDataService=${BS_REQUEST_AUDIT_DATA_SERVICE_API_BASE_URL}BsSelectRequestAuditDataService/
      - AcceptableLatencyThresholdMs=500
      - RetrieveSupersededRecordsLast=false

  retrieve-cohort-request-audit:
    container_name: retrieve-cohort-request-audit
    image: cohort-manager-retrieve-cohort-request-audit
    networks: [cohman-network]
    build:
      context: ./src/Functions/
      dockerfile: CohortDistributionServices/RetrieveCohortRequestAudit/Dockerfile
      args:
        BASE_IMAGE: ${FUNCTION_BASE_IMAGE}
    profiles: [bs-select]
    ports:
      - 7086:7086
    environment:
      - ASPNETCORE_URLS=http://*:7086
      - DtOsDatabaseConnectionString=${DTOS_DATABASE_CONNECTION_STRING}
      - CohortDistributionDataServiceURL=${COHORT_DISTRIBUTION_DATA_SERVICE_API_BASE_URL}CohortDistributionDataService/
      - BsSelectRequestAuditDataService=${BS_REQUEST_AUDIT_DATA_SERVICE_API_BASE_URL}BsSelectRequestAuditDataService/
      - ExceptionFunctionURL=${CREATE_EXCEPTION_API_BASE_URL}CreateException

  transform-data-service:
    container_name: transform-data-service
    image: cohort-manager-transform-data-service
    networks: [cohman-network]
    build:
      context: ./src/Functions/
      dockerfile: CohortDistributionServices/TransformDataService/Dockerfile
      args:
        BASE_IMAGE: ${FUNCTION_BASE_IMAGE}
    environment:
      - ASPNETCORE_URLS=http://*:7080
      - ExceptionFunctionURL=${CREATE_EXCEPTION_API_BASE_URL}CreateException
      - BsSelectOutCodeUrl=${REFERENCE_DATA_SERVICE_API_BASE_URL}BsSelectOutCode
      - BsSelectGpPracticeUrl=${REFERENCE_DATA_SERVICE_API_BASE_URL}BsSelectGpPractice
      - DtOsDatabaseConnectionString=${DTOS_DATABASE_CONNECTION_STRING}
      - LanguageCodeUrl=${REFERENCE_DATA_SERVICE_API_BASE_URL}LanguageCode
      - CurrentPostingUrl=${REFERENCE_DATA_SERVICE_API_BASE_URL}CurrentPosting
      - ExcludedSMULookupUrl=${REFERENCE_DATA_SERVICE_API_BASE_URL}ExcludedSMU
      - AcceptableLatencyThresholdMs=500

  remove-validation-exception-data:
    container_name: remove-validation-exception-data
    image: cohort-manager-remove-validation-exception-data
    networks: [cohman-network]
    build:
      context: ./src/Functions/
      dockerfile: ScreeningValidationService/RemoveValidationException/Dockerfile
      args:
        BASE_IMAGE: ${FUNCTION_BASE_IMAGE}
    environment:
      - ASPNETCORE_URLS=http://*:7085
      - ExceptionFunctionURL=${CREATE_EXCEPTION_API_BASE_URL}CreateException
      - ExceptionManagementDataServiceURL=${EXCEPTION_MANAGEMENT_DATA_SERVICE_API_BASE_URL}ExceptionManagementDataService
      - DemographicDataServiceURL=${PARTICIPANT_DEMOGRAPHIC_DATA_SERVICE_API_BASE_URL}ParticipantDemographicDataService/
      - GPPracticeDataServiceURL=${GP_PRACTICE_DATA_SERVICE_API_BASE_URL}GPPracticeDataService/
      - DtOsDatabaseConnectionString=${DTOS_DATABASE_CONNECTION_STRING}


networks:
  cohman-network:
    external: true
